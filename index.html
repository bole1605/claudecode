<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liegestütz Tracker</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Push-Ups">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-train" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-9"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 12h3M13 12h7M4 17h11M20 17h0"/><circle cx="16" cy="7" r="2.3"/><circle cx="10" cy="12" r="2.3"/><circle cx="18" cy="17" r="2.3"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 01-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2 0-3-1-5 1-8z"/></symbol>
</svg>

<div class="app">
  <nav class="tabbar" role="tablist" aria-label="Bereiche">
    <div class="side-title">Liegestütze</div>
    <button role="tab" data-view="train" aria-selected="true"><svg class="ico"><use href="#i-train"/></svg><span>Training</span></button>
    <button role="tab" data-view="cal" aria-selected="false"><svg class="ico"><use href="#i-cal"/></svg><span>Kalender</span></button>
    <button role="tab" data-view="stats" aria-selected="false"><svg class="ico"><use href="#i-chart"/></svg><span>Statistik</span></button>
  </nav>

  <div class="content">
    <header class="navbar" id="navbar">
      <span class="nav-spacer"></span>
      <span class="nav-title" id="nav-title">Training</span>
      <button class="nav-btn" id="btn-settings" aria-label="Einstellungen"><svg class="ico"><use href="#i-sliders"/></svg></button>
    </header>

    <main id="main">
      <h1 class="large-title" id="title">Training</h1>

      <!-- TRAINING -->
      <section id="view-train" class="view active" role="tabpanel">
        <div class="metrics">
          <div class="metric"><span class="cap">Zeit</span><span class="num" id="timer">00:00</span></div>
          <div class="metric"><span class="cap">Tempo</span><span class="num" id="pace">0,0<small>/min</small></span></div>
          <div class="metric"><span class="cap">Heute</span><span class="num" id="today-total">0</span></div>
        </div>

        <button id="tap" class="tap" aria-label="Liegestütz zählen">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-bg" cx="100" cy="100" r="88"/>
            <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="88"/>
          </svg>
          <span class="tap-count" id="count" aria-live="polite">0</span>
          <span class="tap-hint" id="tap-hint">Tippen zum Starten</span>
        </button>

        <div class="list goal">
          <div class="row">
            <span>Ziel pro Einheit</span>
            <span class="row-end"><b class="mono" id="goal-val">20</b>
              <span class="stepper"><button id="goal-minus" aria-label="Ziel verringern">−</button><button id="goal-plus" aria-label="Ziel erhöhen">+</button></span>
            </span>
          </div>
        </div>

        <div class="controls">
          <button class="btn gray" id="btn-undo"><svg class="ico"><use href="#i-undo"/></svg>−1</button>
          <button class="btn tint" id="btn-pause">Start</button>
          <button class="btn fill" id="btn-finish"><svg class="ico"><use href="#i-check"/></svg>Fertig</button>
        </div>
        <button class="plain-btn" id="btn-reset">Zurücksetzen</button>
      </section>

      <!-- KALENDER -->
      <section id="view-cal" class="view" role="tabpanel">
        <div class="cal-head">
          <h2 id="cal-title"></h2>
          <div class="cal-nav">
            <button class="round-btn" id="cal-prev" aria-label="Vorheriger Monat"><svg class="ico"><use href="#i-left"/></svg></button>
            <button class="round-btn" id="cal-next" aria-label="Nächster Monat"><svg class="ico"><use href="#i-right"/></svg></button>
          </div>
        </div>
        <div class="cal-grid weekdays" id="cal-weekdays" aria-hidden="true"></div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="month-summary" id="month-summary"></div>
        <div id="day-detail"></div>
      </section>

      <!-- STATISTIK -->
      <section id="view-stats" class="view" role="tabpanel">
        <div class="kpis" id="kpis"></div>

        <div class="card">
          <div class="card-head">
            <h3>Fortschritt</h3>
          </div>
          <div class="seg" id="range-seg" role="tablist" style="--n:3;--i:0">
            <i class="thumb"></i>
            <button data-r="days" class="on">30 Tage</button>
            <button data-r="weeks">Wochen</button>
            <button data-r="months">Monate</button>
          </div>
          <div id="chart-main" class="chart"></div>
          <div class="legend"><span><i class="sw bar"></i>Wiederholungen</span><span><i class="sw line"></i>Trend</span></div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Wiederholungen je Einheit</h3></div>
          <div id="chart-sessions" class="chart"></div>
        </div>

        <div class="card" id="insight"></div>
      </section>
    </main>
  </div>
</div>

<div class="toast" id="toast" role="status"><svg class="ico"><use href="#i-check"/></svg><span></span></div>

<dialog id="dlg-settings" aria-labelledby="dlg-title">
  <div class="sheet-bar">
    <span></span><b id="dlg-title">Einstellungen</b>
    <button class="text-btn" id="dlg-close">Fertig</button>
  </div>
  <div class="list-title">Feedback</div>
  <div class="list">
    <label class="row"><span>Ton beim Zählen</span><input type="checkbox" class="switch" id="opt-sound"></label>
    <label class="row"><span>Haptisches Feedback</span><input type="checkbox" class="switch" id="opt-haptic"></label>
    <label class="row"><span>Bildschirm anlassen</span><input type="checkbox" class="switch" id="opt-wake"></label>
  </div>
  <div class="list-title">Daten</div>
  <div class="list">
    <button class="row link" id="btn-export">Daten exportieren</button>
    <button class="row link" id="btn-import">Daten importieren</button>
    <input type="file" id="file-import" accept="application/json" hidden>
  </div>
  <div class="list" style="margin-top:22px">
    <button class="row link danger center" id="btn-wipe">Alle Daten löschen</button>
  </div>
  <p class="list-foot">Deine Trainingsdaten werden ausschließlich auf diesem Gerät gespeichert.</p>
</dialog>

<script src="app.js"></script>
</body>
</html>
