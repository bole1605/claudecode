<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Kasse</title>
<style>
  :root{--bg:#F2F2F7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6)}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--label:#fff;--label2:rgba(235,235,245,.6)}}
  body{margin:0;background:var(--bg);color:var(--label);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;padding:32px 16px}
  main{max-width:480px;margin:0 auto}h1{font-size:30px;margin:0 0 20px}
  a.card{display:block;background:var(--card);border-radius:18px;padding:18px 20px;margin-bottom:12px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  a.card b{display:block;font-size:19px}a.card span{color:var(--label2);font-size:15px}
</style>
</head>
<body>
<main>
  <h1>Kasse</h1>
  <a class="card" href="kasse/"><b>Kasse (Live)</b><span>für die Helfer am Stand</span></a>
  <a class="card" href="kasse-test/"><b>Testversion</b><span>neue Funktionen ausprobieren, keine echten Buchungen</span></a>
</main>
</body>
</html>
