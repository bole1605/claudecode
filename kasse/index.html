<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kasse</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kasse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title">Kasse</h1>
    <div class="segmented" role="tablist" aria-label="Stand wählen" id="tabs"></div>
    <div class="top-spacer"><span class="ver">v6</span></div>
  </header>

  <div class="edit-bar" id="edit-bar" hidden></div>

  <div class="body">
    <main id="main"></main>
    <aside class="bon" aria-label="Aktueller Bon">
      <h2>Bon</h2>
      <ul id="bon-lines"></ul>
      <div class="bon-total"><span>Summe</span><b id="bon-sum">0,00 €</b></div>
      <button class="btn primary" id="pay" disabled>Bezahlen</button>
      <button class="btn destructive" id="clear" disabled>Bon leeren</button>
    </aside>
  </div>

</div>

<!-- Bezahlen / Wechselgeld -->
<dialog id="pay-dlg">
  <div class="pay-grid">
    <div class="pay-info">
      <div class="cap">Zu zahlen</div><div class="pay-big" id="p-total">0,00 €</div>
      <div class="cap">Gegeben</div><div class="pay-big given" id="p-given">–</div>
      <div class="change" id="p-change"></div>
    </div>
    <div class="pay-input">
      <div class="quick" id="p-quick">
        <button class="btn" data-quick="total">Passend</button>
        <button class="btn" data-quick="5">5 €</button><button class="btn" data-quick="10">10 €</button>
        <button class="btn" data-quick="20">20 €</button><button class="btn" data-quick="50">50 €</button>
        <button class="btn" data-quick="100">100 €</button>
      </div>
      <div class="keypad" id="p-keys">
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key=",">,</button><button data-key="0">0</button><button data-key="back" aria-label="Löschen">⌫</button>
      </div>
    </div>
  </div>
  <div class="dlg-actions">
    <button class="btn" id="p-cancel">Abbrechen</button>
    <button class="btn primary" id="p-ok" disabled>Verbuchen</button>
  </div>
</dialog>

<!-- Passwort -->
<dialog id="pw-dlg">
  <form id="pw-form">
    <h2 id="pw-title">Passwort</h2>
    <p id="pw-text"></p>
    <input id="pw-input" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" placeholder="Passwort">
    <p class="err" id="pw-err"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="pw-cancel">Abbrechen</button>
      <button type="submit" class="btn primary">OK</button>
    </div>
  </form>
</dialog>

<!-- Verwaltung (extra Seite) -->
<div id="admin" class="page" hidden>
  <header class="top">
    <h1>Verwaltung</h1>
    <button class="btn primary" id="admin-close">Fertig</button>
  </header>
  <div class="page-body">
    <section class="card" id="admin-summary"></section>
    <section class="card actions-card">
      <button class="btn primary" id="edit-mode">Bearbeitungsmodus (Produkte & Seiten)</button>
      <button class="btn" id="save">Zahlen speichern (Datei)</button>
      <button class="btn" id="pw-change">Passwort ändern</button>
      <button class="btn" id="restore" hidden>Gelöschte Buchungen wiederherstellen</button>
      <button class="btn" id="defaults">Sortiment auf Standard zurücksetzen …</button>
      <button class="btn destructive" id="wipe">Alle Buchungen auf diesem Gerät löschen …</button>
    </section>
    <h3 class="list-h">Buchungen</h3>
    <section class="card" id="sales-list"></section>
  </div>
</div>

<dialog id="item-dlg" class="form-dlg">
  <form id="item-form">
    <h2 id="i-title"></h2>
    <label>Name<input id="i-name" autocomplete="off"></label>
    <label>Zusatz (optional, z. B. „0,5 l“)<input id="i-sub" autocomplete="off"></label>
    <label>Preis in €<input id="i-price" inputmode="decimal" autocomplete="off" placeholder="3,50"></label>
    <label>Unterkategorie<select id="i-group"></select></label>
    <p class="err" id="i-err"></p>
    <div class="dlg-actions">
      <button type="button" class="btn destructive" id="i-del">Löschen</button>
      <button type="button" class="btn" id="i-cancel">Abbrechen</button>
      <button type="submit" class="btn primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="text-dlg" class="form-dlg">
  <form id="text-form">
    <h2 id="t-title"></h2>
    <input id="t-input" autocomplete="off">
    <p class="err" id="t-err"></p>
    <div class="dlg-actions">
      <button type="button" class="btn" id="t-cancel">Abbrechen</button>
      <button type="submit" class="btn primary">OK</button>
    </div>
  </form>
</dialog>

<dialog id="confirm">
  <form method="dialog">
    <h2 id="c-title"></h2>
    <p id="c-text"></p>
    <div class="dlg-actions">
      <button value="cancel" class="btn">Abbrechen</button>
      <button value="ok" class="btn destructive strong" id="c-ok">OK</button>
    </div>
  </form>
</dialog>

<script src="app.js?v=6"></script>
</body>
</html>
