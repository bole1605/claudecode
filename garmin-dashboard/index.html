<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garmin Dashboard</title>
<meta name="description" content="Persönliches Garmin-Dashboard: Tageswerte, Rückblicke, Trainingsvorschläge und Routenplaner für Komoot">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garmin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Hauptnavigation">
    <div class="brand">Garmin<small>Training · Erholung · Routen</small></div>
    <button data-page="today"><span data-sym="today"></span><span>Heute</span></button>
    <button data-page="review"><span data-sym="review"></span><span>Rückblick</span></button>
    <button data-page="train"><span data-sym="train"></span><span>Training</span></button>
  </nav>
  <div class="shell">
    <header class="navbar" id="navbar">
      <div class="nb-title" id="nb-title" aria-hidden="true"></div>
      <div class="nb-end" style="margin-left:auto">
        <button class="icon-btn" id="btn-refresh" aria-label="Daten aktualisieren" title="Daten aktualisieren"><span data-sym="refresh"></span></button>
        <button class="icon-btn" data-open-settings aria-label="Daten und Einstellungen" title="Daten und Einstellungen"><span data-sym="sliders"></span><i class="dot-badge" id="badge-stale" hidden></i></button>
      </div>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>
<dialog id="dlg" aria-label="Daten und Einstellungen"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>Diese App benötigt JavaScript.</noscript>
<script src="vendor/chart.umd.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/charts.js"></script>
<script src="js/pages.js"></script>
<script src="js/route.js"></script>
<script src="js/main.js"></script>
</body>
</html>
