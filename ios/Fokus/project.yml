# Projekt erzeugen:  brew install xcodegen && xcodegen generate
# Vorher anpassen: DEVELOPMENT_TEAM und BUNDLE_PREFIX (eigene, eindeutige ID).
name: Fokus
options:
  bundleIdPrefix: com.example
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: de
settings:
  base:
    DEVELOPMENT_TEAM: ""                 # <- deine Team-ID
    BUNDLE_PREFIX: com.example.fokus     # <- eigene ID, z. B. de.deinname.fokus
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targetTemplates:
  Extension:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
    settings:
      base:
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Config/Fokus.entitlements
        GENERATE_INFOPLIST_FILE: NO
    # Extensions nutzen dieselben Entitlements wie die App.

targets:
  Fokus:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: FokusMonitor
      - target: FokusShieldConfig
      - target: FokusShieldAction
      - target: FokusReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        CODE_SIGN_ENTITLEMENTS: Config/Fokus.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"          # nur iPhone
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Fokus
        FokusAppGroup: group.$(BUNDLE_PREFIX)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSUserNotificationsUsageDescription: Fokus warnt dich kurz vor deinem Limit.
        ITSAppUsesNonExemptEncryption: false

  FokusMonitor:
    templates: [Extension]
    sources: [Monitor]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).monitor }
    info:
      path: Monitor/Info.plist
      properties:
        CFBundleDisplayName: Fokus Monitor
        FokusAppGroup: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FokusMonitor

  FokusShieldConfig:
    templates: [Extension]
    sources: [ShieldConfig]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).shieldconfig }
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Fokus Sperrbildschirm
        FokusAppGroup: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FokusShieldConfiguration

  FokusShieldAction:
    templates: [Extension]
    sources: [ShieldAction]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).shieldaction }
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Fokus Sperraktionen
        FokusAppGroup: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FokusShieldAction

  FokusReport:
    templates: [Extension]
    sources: [Report]
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).report }
    info:
      path: Report/Info.plist
      properties:
        CFBundleDisplayName: Fokus Nutzung
        FokusAppGroup: group.$(BUNDLE_PREFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
